name: Publish package to npm (pnpm)

on:
    release:
        types: [created] # or when a GitHub release is created

permissions:
    contents: read

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org/ # setup-node will write .npmrc when NODE_AUTH_TOKEN exists

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run production

            - name: Verify version not already published
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if npm view @codebender-io/i18n-currency@$VERSION > /dev/null 2>&1; then
                    echo "Version $VERSION already exists on npm. Skipping publish."
                    exit 0
                  fi

            - name: Publish to npm
              run: pnpm publish --access public --no-git-checks
